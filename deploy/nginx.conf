# Реверс-прокси «Тихого Часа»: пускает наружу api.ваш-домен.ru → внутренний
# FastAPI на 127.0.0.1:8080. Домен нужен именно для API — сайт на Vercel
# уже с HTTPS, а вот запросы формы регистрации и кабинета партнёра к
# нашему серверу браузер заблокирует без HTTPS (mixed content).
#
# Установка на VPS (Ubuntu 22.04):
#   sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tihiyapi
#   sudo ln -s /etc/nginx/sites-available/tihiyapi /etc/nginx/sites-enabled/
#   # замените api.ваш-домен.ru на реальный поддомен в обеих строках ниже
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.ваш-домен.ru   # выпускает и настраивает HTTPS сам
#
# ВАЖНО: домен должен успеть указывать на IP этого сервера (A-запись),
# иначе certbot не сможет подтвердить владение доменом.

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
